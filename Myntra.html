<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Myntra Clone</title>
     <link rel="stylesheet" href="myntra.css">
     <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="BOX1">
        <strong ><img src="https://logos-world.net/wp-content/uploads/2021/02/New-Myntra-Logo.png" alt="myntra logo" class="logo"></strong>
        <nav>
            <ul class="BOX2">
            <li>MEN</li>
            <li>WOMEN</li>
            <li>KIDS</li>
            <li>HOME</li>
            <li>BEAUTY</li>
            <li>GENZ</li>
            <li>STUDIO <sup style="color: rgb(236, 33, 67);">NEW</sup></li>
        </ul>
        </nav>
      <div class="search-bar">
        <i class="fas fa-search search-icon"></i>
    
      <input 
        type="search" 
        name="query" 
        placeholder="Search for products, brands and more" 
      />
   
  </div>

    <div class="action-icons">
            <div class="icon-box">
                <i class="far fa-user"></i>
                <span>Profile</span>
            </div>
            <div class="icon-box">
                <i class="far fa-heart"></i>
                <span>Wishlist</span>
            </div>
            <div class="icon-box">
                <i class="fas fa-shopping-bag"></i>
                <span>Bag</span>
            </div>
        </div>
    </header>
</body>
</html>
