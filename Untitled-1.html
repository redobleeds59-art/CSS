<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
   *{
    margin: 0px;

   }

   .big{
    box-sizing: border-box;
    overflow: auto;
    margin: 10px;
    padding: 20px;
    width: 90vw;
    height: 100vh;
    border: 5px groove gray;
    display: flex;
    flex-direction: row;
    justify-content: space-around;
    align-items: center;
   }
    .box{
    box-sizing: border-box;
    flex-basis: 300px;
    flex-shrink: 0;
    height: 100px;
    border: 2px solid black;
    border-radius: 10px;
    padding: 4px;
    }

    .BOX1{
        background-color: aliceblue;
        display:flex;
        justify-content:center;
        align-items:center
        
    }
    .BOX2{
        background-color: rebeccapurple;
        display:flex;
        justify-content:center;
        align-items:center
    }
    .BOX3{
        background-color: orchid;
        display:flex;
        justify-content:center;
        align-items:center
    }
    .BOX4{
        background-color: burlywood;
        display:flex;
        justify-content:center;
        align-items:center
    }
    
    </style>
</head>
<body>
    <div class="big">
        <div class="box BOX1" style="position:sticky; top: 0px;">BOX1</div>
        <div class="box BOX2" style="gap: 10px;">BOX2</div>
        <div class="box BOX3" style="order:3;">BOX3</div>
        <div class="box BOX4" style="flex-grow: 1;">BOX4</div>
    </div>
</body>
</html>
