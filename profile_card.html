<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="profile_card.CSS">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="card">
       <div class="card_color"></div>

      <img src="https://i.pravatar.cc/150?img=33" alt="Profile" class="profile-img">

      <div class="text_design">
        <h2>Krishna S. Jagtap</h2>
        <p class="title">B.Tech CSE Student | Developer</p>
        <p class="bio">Passionate about building scalable web applications and learning new technologies. Always ready for a coding challenge!</p>
      </div>

      <div class="icon">
        <a href="#" class="icon-a"><i class="fa-solid fa-globe" ></i></a>
        <a href="#" class="icon-a"><i class="fa-brands fa-github" ></i></a>
        <a href="#" class="icon-a"><i class="fa-brands fa-linkedin" ></i></a>
      </div>

      <div class="v-text">
        <div>
           <h3>25</h3>
           <p>Projects</p>
        </div>
         <div>
            <h3>1.2K</h3>
            <p>Followers</p>
        </div>
         <div>
             <h3>85</h3>
            <p>Following</p>
         </div>
      </div>
    </div>
</body>
</html>
