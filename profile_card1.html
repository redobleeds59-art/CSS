<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conic Gradient Profile Card</title>
    <!-- CSS File Link -->
    <link rel="stylesheet" href="profile_card1.css">
    <!-- FontAwesome link for Social Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <div class="card">
        <!-- Colorful Conic Gradient Header -->
        <div class="card-header"></div>
        
        <!-- Profile Image (Absolute Position) -->
        <img src=https://i.pinimg.com/564x/f3/78/e7/f378e795f677d222c539d01fb1603e5a.jpg alt="Profile" class="profile-img">
        
        <!-- Card Content -->
        <div class="card-body">
            <h1 class="name">Emma Carter</h1>
            <p class="title">Product Designer</p>

            <!-- Social Icons (Flexbox) -->
            <div class="social-icons">
                <a href="#"><i class="fa-solid fa-globe"></i></a>
                <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#"><i class="fa-solid fa-briefcase"></i></a>
               
                <a href="#"><i class="fa-solid fa-at"></i></a>
            </div>

            <p class="bio">
                Crafting intuitive digital experiences through research, design systems, and visual storytelling.
            </p>
        </div>
    </div>

</body>
</html>
